# OpenAgent Harness — Model Registry
#
# Every entry below was checked against the Hugging Face Hub API on
# 2026-10-03 (repo id, revision/commit sha, exact GGUF file sha256 + size are
# taken directly from the Hub's file-metadata API, not guessed). Re-run
# `openagent models refresh-registry --id <model_id>` periodically to detect
# upstream changes -- a changed sha256 at the same filename is treated as a
# supply-chain signal and blocks auto-use until a human re-approves it.
#
# Fields:
#   id                 stable local identifier used everywhere in the harness
#   role               one or more of: planner, executor, reviewer, embedding,
#                      speculative_draft, decision_router
#   status             reference_only | available | gated | unavailable
#   source.repo        Hugging Face repo id
#   source.revision    pinned commit sha (NOT a mutable branch name)
#   source.filename    exact file inside the repo (null = multi-shard safetensors)
#   source.sha256      sha256 of the exact file (git-lfs oid), verified after download
#   license             SPDX id as declared by the repo's model card metadata
#   license_verified    whether a human/CI step confirmed the declared license
#                        text matches actual usage terms (not just the tag)
#   benchmark_status    vendor_claims_unverified | locally_benchmarked | failed_gate
#   verification.*      acceptance-gate checklist, see docs/model-selection.md
#   gate_passed          overall go/no-go for use as the PRIMARY agent backend

schema_version: 1
last_checked: "2026-10-03"
default_model_id: qwen3.8-27b-gguf-q4km

