      Authoritative upstream weights. Dense hybrid (Gated DeltaNet + full
      attention) 27-28B model. No official GGUF is published in this repo
      (confirmed via Hub file listing) -- use one of the pinned GGUF
      derivatives below to actually run it under llama.cpp on Colab/Kaggle.
      Treat all vendor-reported benchmark numbers as claims to verify locally
      before relying on them (see docs/model-selection.md).
