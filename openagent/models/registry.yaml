  # ---------------------------------------------------------------------
  # 5) Cloudflare Clef — decision/router component, NOT a chat/coding model
  # ---------------------------------------------------------------------
  - id: cloudflare-clef-27b
    display_name: "Cloudflare Clef (27B decision/classification model)"
    role: [decision_router]   # explicitly excluded from planner/executor/reviewer roles
    status: available
    family: clef
    architecture: qwen3_5   # frozen Qwen3.8-27B backbone + custom schema head
    base_model: Qwen/Qwen3.8-27B
    source:
      repo: Cloudflare/clef
      revision: 2f3de3dd85f379784083b0814d997ab627200f0c
      filename: null   # safetensors + custom modeling code (trust_remote_code)
      sha256: null
      manifest_url: "https://huggingface.co/api/models/Cloudflare/clef"
      format: safetensors-custom-code
    license: Apache-2.0
    license_verified: true
    context: { native: 65536 }
    vision: true
    tool_template: null   # not a chat/tool-calling model
    output_type: "typed probability distributions over caller-supplied options (schema head)"
    hardware: { min_vram_gb: 24, min_ram_gb: 16, fits_colab_free: false, fits_kaggle_free: true }
    harness_policy: >
      MUST NOT be registered as a general coding/chat agent backend. It
      performs a single prefill-only forward pass and returns calibrated
      probabilities for a caller-defined schema of typed questions/options --
      it does not generate free-form text. Only usable through the
      dedicated decision-router runtime (openagent.runtime.router), with its
      own validation (schema well-formedness, option-set size, calibration
      spot checks) and its own hardware budget, never time-shared with the
      resident planner/executor model's VRAM without an explicit multi-model
      budget.
    benchmark_status: vendor_claims_unverified
    verification: { checksum_verified_locally: false, server_health_checked: false,
                     schema_validation_tested: false, safety_reviewed: false,
                     latency_profiled: false }
    gate_passed: false

