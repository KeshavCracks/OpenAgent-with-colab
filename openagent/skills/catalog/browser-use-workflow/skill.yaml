name: browser-use-workflow
version: "0.1.0"
summary: >
  Operate a real browser for permitted pages: navigation, clicking, forms,
  screenshots, DOM/console/network inspection, with required approval for
  sensitive actions.
triggers:
  - "browse the web"
  - "click the button"
  - "fill out the form"
  - "take a screenshot"
  - "inspect the dom"
  - "network requests"
required_tools: []
required_permissions: [browser:navigate, browser:interact, browser:approval_required]
source:
  repo: "Browser Use (browser-use/browser-use), official project"
  pinned_revision: "env:BROWSER_USE_REF"
license: "MIT (verify against the pinned revision's LICENSE before relying on this)"
context_budget_tokens: 500
verification_procedure:
  - "every destructive/auth/payment/upload action has a recorded user-approval event before execution"
  - "citations collected during browsing reference the exact URL and timestamp visited"
harness_policy: >
  Requires explicit user approval for authentication, uploads, payments,
  account actions, or destructive operations. Disabled by default
  (config: browser.enabled=false) -- enable explicitly per session.
body_file: SKILL.md
