name: packaged-skill-workflow
version: "0.1.0"
summary: >
  Discover and run packaged SKILL.md-style skills using a CLI/discovery
  approach, adapted from vercel-labs/agent-skills.
triggers:
  - "packaged skill"
  - "skill.md"
  - "skills cli"
  - "discover skills"
  - "install a skill"
required_tools: [read, glob, grep]
required_permissions: [fs:read]
source:
  repo: https://github.com/vercel-labs/agent-skills
  pinned_revision: "063bee94c3f4df8453406c830b0a7df0f2860278"
license: "UNSPECIFIED upstream -- re-check the repo's LICENSE file before redistribution"
context_budget_tokens: 500
verification_procedure:
  - "Confirm the upstream repo still ships a LICENSE file compatible with this project's usage before vendoring any content verbatim."
  - "Validate every imported SKILL.md against the local skill.yaml schema (openagent.skills.registry)."
body_file: SKILL.md
