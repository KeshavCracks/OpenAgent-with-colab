name: scientific-research-assistant
version: "0.1.0"
summary: >
  Research-assistant workflows requiring sources, citations, reproducible
  methods, and uncertainty labels; fabricated citations/benchmarks/results
  are prohibited.
triggers:
  - "research"
  - "literature review"
  - "cite your sources"
  - "reproduce results"
  - "benchmark comparison"
  - "paper summary"
required_tools: [memory, read, grep]
required_permissions: [fs:read, memory:read, memory:write]
source:
  repo: "harness-authored; see docs/research-skill-direction.md for the 160+ skill-area direction note"
  pinned_revision: "n/a"
license: Apache-2.0
context_budget_tokens: 600
verification_procedure:
  - "every factual claim has an inline citation resolvable to a real, fetchable source"
  - "benchmark numbers are labeled 'vendor-reported' vs 'locally reproduced'"
  - "uncertainty is stated explicitly when evidence is incomplete or conflicting"
harness_policy: >
  Never fabricate citations, papers, benchmark numbers, or experimental
  results. If a source cannot be found or a number cannot be reproduced
  locally, say so explicitly rather than inventing a plausible-looking one.
body_file: SKILL.md
