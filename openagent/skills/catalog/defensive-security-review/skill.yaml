name: defensive-security-review
version: "0.1.0"
summary: >
  Defensive-only cybersecurity review: secure coding, dependency auditing,
  secret scanning, authentication review, input validation, logging safety,
  and vulnerability remediation. No offensive/exploit content.
triggers:
  - "security review"
  - "secret scan"
  - "dependency audit"
  - "vulnerability"
  - "authentication review"
  - "input validation"
  - "secure coding"
  - "cve"
required_tools: [read, glob, grep, shell]
required_permissions: [fs:read, shell:exec]
source:
  repo: "Anthropic cybersecurity skills guidance (defensive-only); see docs/security.md for citations"
  pinned_revision: "n/a -- harness-authored checklist, not a vendored repo"
license: Apache-2.0
context_budget_tokens: 700
verification_procedure:
  - "openagent security secret-scan over the full diff"
  - "openagent security dep-audit against the project's manifest/lockfile"
  - "manual authentication/authorization checklist for any changed auth path"
harness_policy: >
  Defensive use only. Prohibited: unauthorized access, malware or exploit
  development, credential theft, botnet/ransomware behavior, and offensive
  intrusion workflows against systems the user does not own or is not
  explicitly authorized to test.
body_file: SKILL.md
