name: diagram-as-code
version: "0.1.0"
summary: >
  Generate architecture, sequence, data-flow, threat-model, and agent-trace
  diagrams as version-controlled code (Mermaid/Graphviz), not opaque images.
triggers:
  - "diagram"
  - "architecture diagram"
  - "sequence diagram"
  - "data flow diagram"
  - "threat model"
  - "agent trace diagram"
  - "mermaid"
  - "graphviz"
required_tools: [read, patch, shell]
required_permissions: [fs:read, fs:write, shell:exec]
source:
  repo: "harness-authored, Claude-Code-style diagram-as-code pattern"
  pinned_revision: "n/a"
license: Apache-2.0
context_budget_tokens: 500
verification_procedure:
  - "diagram source file (.mmd/.dot) is committed alongside any rendered image"
  - "rendered output (if any) is regenerated from source via openagent diagram render, not hand-edited"
body_file: SKILL.md
