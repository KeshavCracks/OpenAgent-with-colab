# OpenAgent Harness default configuration.
#
# SECURITY: this file is committed to git. Never put a real API key, token,
# cookie, or password in here. Only "env:VAR_NAME" or "keyring:service:key"
# references (or the literal "CHANGE_ME" placeholder) are allowed -- a
# startup check rejects the file otherwise. Put real secrets in a local
# `.env` (gitignored) or your OS keyring. See docs/security.md.

mode: local-workspace-remote-inference   # or: remote-workspace-remote-execution

harness:
  low_ram_mode: true          # never load model weights into the local process
  max_context_tokens: 8000    # starting context window; expand only after
                               # measuring VRAM headroom and tool reliability
  context_budget:
    soft_limit_tokens: 6000
    hard_limit_tokens: 8000
    summarize_when_over: true

workspace:
  root: "."                   # containment boundary for all file/shell tools
  deny_paths: [".git/config", ".git/credentials", ".env", ".netrc"]

providers:
  order: ["colab", "kaggle"]
  colab:
    enabled: true
    api_token: "env:COLAB_API_TOKEN"        # optional, only for colab-mcp
    notebook_access_token: "env:COLAB_NOTEBOOK_TOKEN"
    limits:
      max_session_hours: 12
      vram_gb: 15
      ram_gb: 12
      disk_gb: 70
      gpu: "T4"
      cpu_cores: 2
      weekly_gpu_quota_hours: null
      public_inbound_address: false
  kaggle:
    enabled: true
    username: "env:KAGGLE_USERNAME"
    api_key: "env:KAGGLE_KEY"
    limits:
      max_session_hours: 12
      vram_gb: 30
      ram_gb: 29
      disk_gb: 20
      gpu: "T4x2"
      cpu_cores: 4
      weekly_gpu_quota_hours: 30
      public_inbound_address: false

runtime:
  engine: llama.cpp
  server:
    bind: "127.0.0.1"          # loopback by default; remote tunnels are
                                 # short-lived and authenticated, never public
    port: 8080
    context_length: 8192
    kv_cache_type: q8_0
    flash_attention: auto
    parallel_slots: 1
  auth:
    bearer_token: "env:LLAMA_SERVER_TOKEN"
  tunnel:
    mode: ssh-or-colab-proxy    # short-lived, authenticated only
    ttl_minutes: 90

models:
  default: qwen3.8-27b-gguf-q4km
  registry_path: openagent/models/registry.yaml

mcp:
  builtin_stdio: true
  providers_order: ["colab", "kaggle"]
  allow_public_endpoints: false

memory:
  backend: sqlite
  path: "~/.openagent/memory/memory.sqlite3"
  default_ttl_days: 180
  redact_secrets: true

skills:
  catalog_path: openagent/skills/catalog
  max_context_budget_tokens: 1200
  sources:
    - name: agent-skills-addyosmani
      repo: https://github.com/addyosmani/agent-skills
      pinned_ref: "env:AGENT_SKILLS_ADDYOSMANI_REF"   # pin a commit/tag once vendored
    - name: agent-skills-vercel-labs
      repo: https://github.com/vercel-labs/agent-skills
      pinned_ref: "env:AGENT_SKILLS_VERCEL_REF"

research:
  agent_reach:
    enabled: true
    repo: https://github.com/Panniantong/agent-reach
    pinned_ref: "env:AGENT_REACH_REF"
    login_gated_platforms: [instagram, facebook, reddit, x, twitter, xiaohongshu, linkedin]
    require_user_owned_session_for_gated_platforms: true

browser:
  enabled: false                 # off by default; enable explicitly
  require_approval_for: [login, upload, payment, account_action, destructive_action]

logging:
  level: INFO
  dir: "~/.openagent/logs"
