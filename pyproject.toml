[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-harness"
version = "0.1.0"
description = "A downloadable, GitHub-ready local AI agent harness: low-RAM local orchestration with remote (Colab/Kaggle) GPU inference, tools, skills, memory, MCP, and developer observability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenAgent Harness contributors" }]
keywords = ["agent", "harness", "llama.cpp", "colab", "kaggle", "mcp", "coding-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "build>=1.0",
]
browser = [
  "playwright>=1.40",
]
keyring = [
  "keyring>=24.0",
]
all = [
  "openagent-harness[dev,browser,keyring]",
]

[project.scripts]
openagent = "openagent.cli:main"

[tool.setuptools.packages.find]
include = ["openagent*"]

[tool.setuptools.package-data]
openagent = [
  "config_default.yaml",
  "models/registry.yaml",
  "skills/catalog/**/*.yaml",
  "skills/catalog/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
